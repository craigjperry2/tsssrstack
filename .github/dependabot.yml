version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  # deno.json imports (JSR and npm). Datastar is vendored because it is not on npm or JSR; the
  # "Datastar update" workflow covers it.
  - package-ecosystem: deno
    directory: /
    schedule: { interval: weekly }
    # Skip releases younger than a week, so a compromised publish is likely caught first.
    cooldown: { default-days: 7 }
  # flake.lock inputs. Bumping nixpkgs updates the Deno and PostgreSQL used by CI and orbs.
  - package-ecosystem: nix
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /infra/nginx
    schedule: { interval: weekly }
