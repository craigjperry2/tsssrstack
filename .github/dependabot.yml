version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  # package.json and pnpm-lock.yaml. The browser assets in src/app/static/vendor are not npm
  # dependencies; the "Datastar update" and "Oat update" workflows keep them current.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Skip releases younger than a week, so a compromised publish is likely caught first.
    cooldown: { default-days: 7 }
  # flake.lock inputs. Bumping nixpkgs updates the Node, pnpm and PostgreSQL used by CI and orbs.
  - package-ecosystem: nix
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /infra/nginx
    schedule: { interval: weekly }
