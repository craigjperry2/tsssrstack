name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The Datastar update workflow dispatches CI on the pull requests it opens, because pull requests
  # created with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The job name and matrix produce the required status checks on main:
  # "node (ubuntu-latest)" and "node (macos-latest)". Renaming either requires updating the
  # "main" ruleset in the repository settings, or every pull request will wait forever.
  node:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # A throwaway cluster for the repository and schema tests, started below from the Nix shell.
      # Migrations run as the owner; the tests connect as the runtime login, like the app.
      MIGRATION_DATABASE_URL: postgres://app@127.0.0.1:5432/app
      DATABASE_URL: postgres://app_web@127.0.0.1:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Exactly the lockfile; pnpm-workspace.yaml re-checks release age and trust for every entry.
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm fmt:check
      - run: nix develop -c pnpm lint
      - run: nix develop -c pnpm check
      - name: Start PostgreSQL and apply migrations
        run: |
          nix develop -c sh -c '
            set -eu
            initdb -D "$RUNNER_TEMP/pg" -U app --auth=trust -E UTF8 --no-locale >/dev/null
            pg_ctl -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -w start \
              -o "-c listen_addresses=127.0.0.1 -c port=5432 -k $RUNNER_TEMP"
            createdb -h 127.0.0.1 -U app app
            psql -h 127.0.0.1 -U app -d app -X -q -v ON_ERROR_STOP=1 -f infra/postgres/dev-roles.sql
            pnpm migrate'
      - run: nix develop -c pnpm test
      - run: nix develop -c pnpm audit
      # The production package (docs/adr/0007). Fails when pnpm-lock.yaml changed but the pnpmDeps
      # hash in infra/nixos/package.nix did not.
      - name: Build the Nix package
        if: runner.os == 'Linux'
        run: nix build .#tsssrstack
      - name: Verify vendored assets match SHA256SUMS
        run: nix develop -c sh -c 'cd src/app/static/vendor && sha256sum --check --strict SHA256SUMS'
