# Development reverse proxy, started by process-compose.yaml with its prefix (-p) at .data/nginx/,
# where the relative pid and temp paths below live.
worker_processes auto;
error_log /dev/stderr info;
pid nginx.pid;
events { worker_connections 1024; }
http {
  client_body_temp_path client_body_temp;
  proxy_temp_path proxy_temp;
  fastcgi_temp_path fastcgi_temp;
  uwsgi_temp_path uwsgi_temp;
  scgi_temp_path scgi_temp;
  log_format json escape=json '{"request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"bytes":$body_bytes_sent,"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  server {
    listen 127.0.0.1:8080;
    server_name _;
    location ~ ^/(login|register)$ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header X-Request-ID $request_id;
    }
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
